name: bitera

# BIT ERA by TrapWin (branch "bitera" of this repo): builds, tests and packages Windows (VST3 + Standalone)
# and macOS (VST3 + AU + Standalone, universal). Every push publishes the latest test build to fixed links:
#   https://github.com/txcjournal-byte/trapwin-limiter/releases/download/bitera-test/BIT-ERA-Setup-Windows.exe
#   https://github.com/txcjournal-byte/trapwin-limiter/releases/download/bitera-test/BIT-ERA-VST3-Windows.zip
#   https://github.com/txcjournal-byte/trapwin-limiter/releases/download/bitera-test/BIT-ERA-Setup-Mac.pkg
#   https://github.com/txcjournal-byte/trapwin-limiter/releases/download/bitera-test/BIT-ERA-VST3-Mac.zip
#   https://github.com/txcjournal-byte/trapwin-limiter/releases/download/bitera-test/BIT-ERA-AU-Mac.zip
on:
  push:
    branches: [bitera]
  workflow_dispatch:

concurrency:
  group: bitera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build-bitera
          key: bitera-win-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: bitera-win-${{ hashFiles('CMakeLists.txt') }}-

      - name: Configure
        run: cmake -S . -B build-bitera -A x64

      - name: Build
        run: cmake --build build-bitera --config Release --parallel --target BitEra_VST3 BitEra_Standalone BitEraTests

      - name: Render test (all presets)
        shell: pwsh
        run: |
          & build-bitera\BitEraTests_artefacts\Release\BitEraTests.exe
          exit $LASTEXITCODE

      - name: pluginval (strictness 8)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          & .\pluginval\pluginval.exe --strictness-level 8 --verbose --validate "build-bitera\BitEra_artefacts\Release\VST3\Bit Era.vst3" 2>&1 | Tee-Object -FilePath pluginval.log | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path pluginval.log -Pattern 'fail|error|crash|exception|assert|!!!' | Select-Object -Last 25 | ForEach-Object { Write-Output "::error title=pluginval::$($_.Line)" }
            Get-Content pluginval.log -Tail 30 | ForEach-Object { Write-Output "::warning title=pluginval tail::$_" }
          }
          exit $code

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(BIT_ERA VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          Remove-Item -Recurse -Force build-bitera\installer -ErrorAction SilentlyContinue
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\win\bitera.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish test build (fixed links)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force out, out\stage | Out-Null
          Copy-Item (Get-ChildItem build-bitera\installer\*.exe | Select-Object -First 1).FullName out\BIT-ERA-Setup-Windows.exe
          Copy-Item -LiteralPath "build-bitera\BitEra_artefacts\Release\VST3\Bit Era.vst3" -Destination out\stage -Recurse -Force
          Get-ChildItem out\stage -Recurse -File -Include *.pdb,*.ilk,*.exp,*.lib | Remove-Item -Force
          Compress-Archive -LiteralPath "out\stage\Bit Era.vst3" -DestinationPath out\BIT-ERA-VST3-Windows.zip -Force
          $notes = "Bit Era - latest test build`n`nCommit: ${{ github.sha }}`nBranch: ${{ github.ref_name }}`nBuilt: $(Get-Date -Format u)"
          gh release view bitera-test *> $null
          if ($LASTEXITCODE -ne 0) { gh release create bitera-test --prerelease --title "BIT ERA - latest test build" --notes $notes --target ${{ github.sha }} }
          else { gh release edit bitera-test --notes $notes }
          gh release upload bitera-test out\BIT-ERA-Setup-Windows.exe out\BIT-ERA-VST3-Windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

  macos:
    runs-on: macos-15-intel   # the arm64 macOS pool kept refusing jobs (capacity); the build is universal either way
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Configure (universal)
        run: cmake -S . -B build-bitera -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build-bitera --config Release --parallel 4 --target BitEra_VST3 BitEra_AU BitEra_Standalone BitEraTests

      - name: Render test (every 37th preset; Windows renders the full bank)
        env:
          BE_QUICK: '1'
        run: ./build-bitera/BitEraTests_artefacts/Release/BitEraTests

      - name: auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build-bitera/BitEra_artefacts/Release/AU/Bit Era.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -v aumu Btea Trpw

      - name: pluginval (strictness 8)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q -o pluginval.zip
          set +e
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --verbose --validate-in-process --validate "build-bitera/BitEra_artefacts/Release/VST3/Bit Era.vst3" > pluginval.log 2>&1
          code=$?
          cat pluginval.log
          if [ $code -ne 0 ]; then
            # surface the failure in the run summary (the raw log is not always reachable)
            grep -n -i -E "fail|error|crash|exception|assert|!!!" pluginval.log | tail -25 | while IFS= read -r line; do echo "::error title=pluginval::${line}"; done
            tail -30 pluginval.log | while IFS= read -r line; do echo "::warning title=pluginval tail::${line}"; done
          fi
          exit $code

      - name: Mac signing setup (same secrets as EVOLVE; unsigned when they are missing)
        env:
          MAC_CERT_APP_P12: ${{ secrets.MAC_CERT_APP_P12 }}
          MAC_CERT_INSTALLER_P12: ${{ secrets.MAC_CERT_INSTALLER_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: installer/mac/setup_signing.sh

      - name: Installer (pkg; signed + notarized when secrets exist)
        run: |
          VERSION=$(sed -n 's/project(BIT_ERA VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          installer/mac/build_pkg.sh "$VERSION"

      - name: Publish test build (fixed links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp build-bitera/installer/BIT-ERA-*-macOS.pkg out/BIT-ERA-Setup-Mac.pkg
          cp build-bitera/installer/BIT-ERA-VST3-Mac.zip build-bitera/installer/BIT-ERA-AU-Mac.zip out/
          if ! gh release view bitera-test > /dev/null 2>&1; then
            gh release create bitera-test --prerelease --title "BIT ERA - latest test build" --notes "Bit Era - latest test build" --target "$GITHUB_SHA" || true
          fi
          gh release upload bitera-test out/BIT-ERA-Setup-Mac.pkg out/BIT-ERA-VST3-Mac.zip out/BIT-ERA-AU-Mac.zip --clobber

  # The whole factory bank as WAV files (per era zip, era / category folders) on the test release.
  # Runs on a manual start or when the commit message contains [wav].
  wav-bank:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wav]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype6-dev libfontconfig1-dev libasound2-dev zip > /dev/null
      - name: Build the render tool
        run: |
          cmake -S . -B build-wav -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wav --parallel 4 --target BitEraRenderDemo
      - name: Render 7,200 presets and publish one zip per era
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TOOL=build-wav/BitEraRenderDemo_artefacts/Release/BitEraRenderDemo
          if ! gh release view bitera-test > /dev/null 2>&1; then
            gh release create bitera-test --prerelease --title "BIT ERA - latest test build" --notes "Bit Era - latest test build" --target "$GITHUB_SHA" || true
          fi
          for e in $(seq 0 11); do
            rm -rf wav && mkdir wav
            $TOOL wav --all $e $e > /dev/null
            dir=$(ls wav)
            name="BIT-ERA-WAV-$(echo "$dir" | cut -d' ' -f1-2 | tr ' ' '-').zip"
            (cd wav && zip -q -r "../$name" .)
            echo "$name $(du -h "$name" | cut -f1) $(find wav -name '*.wav' | wc -l) files"
            gh release upload bitera-test "$name" --clobber
            rm -f "$name"
          done
