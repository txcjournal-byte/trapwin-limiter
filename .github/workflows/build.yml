name: Build TrapWin Limiter

# Runs on every push. Pushing a tag like v2.5 also publishes a GitHub Release
# with the finished customer files (Windows installer + ZIP, macOS installer).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  # ------------------------------------------------------------------ DSP tests
  test-dsp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP tests
        working-directory: test
        run: |
          g++ -std=c++17 -O2 -I../plugin -I../dpf/distrho -I../dpf/distrho/src dsptest.cpp -o dsptest -lpthread -ldl
          ./dsptest | tee dsptest.log
          grep -q "ALL PASSED" dsptest.log
      - name: UI click test (mock)
        working-directory: test
        run: |
          g++ -std=c++17 -I../plugin -Imock clicktest.cpp -o clicktest
          ./clicktest

  # ------------------------------------------------------------------ Windows
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile VST3 + CLAP (llvm-mingw)
        run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: win-bin
          path: bin/

  windows-package:
    needs: windows-build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: win-bin
          path: bin
      - name: Validate VST3 with pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          unzip -q pluginval.zip -d pluginval
          set +e
          ./pluginval/pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir pluginval-logs --validate "bin/TrapLimit.vst3" > pv.txt 2>&1
          rc=$?
          bash scripts/report-pluginval.sh pv.txt $rc
      - name: Stage files
        run: |
          V="${APP_VERSION}"; [ "$V" = "dev" ] && V="2.5"; V="${V#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          S="out/stage-win"; mkdir -p "$S"
          cp -r bin/TrapLimit.vst3 bin/TrapLimit.clap "$S/"
          cp "dist/EULA.txt" "dist/README - INSTALL.txt" "dist/THIRD-PARTY-LICENSES.txt" "dist/TrapWin Limiter - Manual.pdf" "$S/"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:V /DSrcDir="$PWD\out\stage-win" /DOutDir="$PWD\out\release" installer\windows\TrapWinLimiter.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: ZIP for manual install
        shell: pwsh
        run: |
          $n = "TrapWin_Limiter_v$($env:V)_Windows"
          New-Item -ItemType Directory -Force -Path "out\zip\$n" | Out-Null
          Copy-Item -Recurse out\stage-win\* "out\zip\$n\"
          Compress-Archive -Path "out\zip\$n" -DestinationPath "out\release\$n.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-windows-logs
          path: pluginval-logs/

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-14
    env:
      CFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15 -DMAC_OS_X_VERSION_MAX_ALLOWED=MAC_OS_X_VERSION_10_15 -DMAC_OS_X_VERSION_MIN_REQUIRED=MAC_OS_X_VERSION_10_15
      CXXFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15 -DMAC_OS_X_VERSION_MAX_ALLOWED=MAC_OS_X_VERSION_10_15 -DMAC_OS_X_VERSION_MIN_REQUIRED=MAC_OS_X_VERSION_10_15
      LDFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal VST3 + AU + CLAP
        run: |
          make -C plugin -j"$(sysctl -n hw.ncpu)"
          ls -la bin
          lipo -info bin/TrapLimit.vst3/Contents/MacOS/TrapLimit bin/TrapLimit.component/Contents/MacOS/TrapLimit
      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R bin/TrapLimit.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i trapwin || true
          auval -strict -v aufx TrLm TrVs
      - name: Validate VST3 with pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip -d pluginval
          set +e
          ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process --output-dir pluginval-logs --validate bin/TrapLimit.vst3 > pv.txt 2>&1
          rc=$?
          bash scripts/report-pluginval.sh pv.txt $rc
      - name: Import Apple signing certificates
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_APP_P12 != '' && env.MACOS_CERT_INSTALLER_P12 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$MACOS_CERT_APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_CERT_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
          security import "$RUNNER_TEMP/app.p12"  -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          rm -f "$RUNNER_TEMP"/*.p12
          APP_ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          INST_ID=$(security find-identity -v "$KC" | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "MACOS_SIGN_APP=$APP_ID" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_INSTALLER=$INST_ID" >> "$GITHUB_ENV"
          echo "Signing as: $APP_ID / $INST_ID"
      - name: Build installer (.pkg), sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          V="${APP_VERSION}"; [ "$V" = "dev" ] && V="2.5"; V="${V#v}"
          installer/macos/build_pkg.sh "$V" dist out/release
          cp "dist/TrapWin Limiter - Manual.pdf" out/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            out/release/*.pkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-macos-logs
          path: pluginval-logs/

  # ------------------------------------------------------------------ Release (only for tags v*)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-dsp, windows-package, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/TrapWin Limiter - Manual.pdf" release/
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* --title "TrapWin Limiter ${GITHUB_REF_NAME}" --notes "Windows: Setup.exe (installer) or .zip (manual install). macOS: .pkg installer (Intel + Apple Silicon)."
